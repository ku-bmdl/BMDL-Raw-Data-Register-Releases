name: Deploy download page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Refuse to replace an existing release catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$(gh release list --limit 1 --json tagName)" != "[]" ]]; then
            echo "A published release exists; release.published must deploy the catalog."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
