name: Publish update catalog and download page

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select monotonic channel releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          RELEASE_EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt > release-list.json
          node scripts/select-channel-releases.mjs
      - name: Rebuild both channel pointers from immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for channel in pilot stable; do
            tag="$(jq -r ".${channel} // empty" selected-releases.json)"
            if [[ -z "$tag" ]]; then continue; fi
            assets="release-assets-${channel}"
            event="release-event-${channel}.json"
            gh release download "$tag" --dir "$assets"
            gh api "repos/${{ github.repository }}/releases/tags/${tag}" | jq '{release: .}' > "$event"
            GITHUB_EVENT_PATH="$event" RELEASE_ASSETS_DIR="$assets" RELEASE_SITE_DIR="site/raw-data-register" node scripts/publish-release.mjs
          done
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
